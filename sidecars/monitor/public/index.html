<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Window Monitor</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="masthead" id="masthead">
    <header class="live-bar" id="liveBar">
      <div class="live-bar-inner">
        <div class="live-left">
          <span class="live-pill" id="livePill"><span class="live-dot" id="liveDot"></span>LIVE</span>
          <span class="hud-chip" id="liveContext">--</span>
          <span class="hud-chip" id="liveQuota">--</span>
          <span class="hud-reset c-dim" id="liveReset">--</span>
        </div>
        <div class="live-right">
          <button class="icon-btn top-ctrl" id="btnAccounts" type="button" title="账号与配额">
            <svg class="btn-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="5.5" r="2.75" />
              <path d="M3 13.25c.7-2.2 2.5-3.5 5-3.5s4.3 1.3 5 3.5" />
            </svg>
            <span class="tnum" id="liveAcctCount">0</span>
          </button>
          <button class="icon-btn top-ctrl" id="btnDetails" type="button" title="展开详情">
            <span id="btnDetailsLabel">详情</span>
            <svg class="chev-down" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 4.5 6 8l3.5-3.5" />
            </svg>
          </button>
          <button class="icon-btn icon-only top-ctrl" id="btnRefresh" type="button" title="立即刷新" aria-label="Refresh">
            <svg class="btn-ico spin-glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.45-3.72" />
              <path d="M13.5 2.75v2.5h-2.5" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <nav class="tabs" id="tabNav" role="tablist">
      <div class="tabs-inner" id="tabsInner">
        <button class="tab active" data-tab="session" type="button" role="tab"></button>
        <button class="tab" data-tab="sessions" type="button" role="tab"></button>
        <button class="tab" data-tab="cost" type="button" role="tab"></button>
        <button class="tab" data-tab="models" type="button" role="tab"></button>
        <button class="tab" data-tab="calendar" type="button" role="tab"></button>
        <button class="tab" data-tab="settings" type="button" role="tab"></button>
        <span class="tab-slider" id="tabSlider" aria-hidden="true"></span>
      </div>
    </nav>

    <div class="drawer hidden" id="detailsDrawer"></div>
    <div class="drawer hidden" id="accountsDrawer"></div>
  </div>

  <main class="content" id="mainContent">
    <div class="loading">加载中…</div>
  </main>

  <footer class="eoc-sentinel" id="eocSentinel" aria-hidden="true">
    <span class="eoc-sentinel-text" id="eocText">已到底</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
